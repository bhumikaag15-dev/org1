<section class="form-section">

<h2>Register Water Complaint</h2>

<form id="complaintForm">

<input
type="text"
id="name"
placeholder="Your Name"
required>

<input
type="text"
id="mobile"
placeholder="Mobile Number"
required>

<input
type="text"
id="villagename"
placeholder="Village Name"
required>
<input
    type="text"
    id="address"
    placeholder="Actual Address / Location"
    required
>
<select id="problem">

<option>Select Problem</option>

<option>Water Leakage</option>

<option>No Water Supply</option>

<option>Dirty Water</option>

<option>Broken Hand Pump</option>

<option>Pipe Burst</option>

</select>

<textarea
id="description"
placeholder="Describe the problem"
rows="5"></textarea>
<label for="issuePhoto" class="upload-label">
    📷 Upload Photo of the Issue
</label>

<input
    type="file"
    id="issuePhoto"
    accept="image/*"
>
<button class="btn" type="submit">
Submit Complaint
</button>

</form>

<p id="successMessage"></p>

</section>
