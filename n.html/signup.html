<section class="form-section">

<h2>Create Your JalSahay Account</h2>

<form id="signupForm">

<input
type="text"
id="signupName"
placeholder="Full Name"
required
>

<input
type="email"
id="signupEmail"
placeholder="Email Address"
required
>

<input
type="password"
id="signupPassword"
placeholder="Create Password"
required
>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required
>

<button class="btn" type="submit">
Create Account
</button>

</form>

<p id="signupMessage"></p>

<p>
Already have an account?

</p>
